<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Все фанты</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

<main class="screen">
  <header class="header">
    <h1 class="logo">Фанты</h1>
  </header>

  {% if fantasies %}
    <div class="fantasy-list">
      {% for fantasy in fantasies %}
      <a href="/fantasy/{{ fantasy.id }}" class="list-item">
        <img src="/static/uploads/{{ fantasy.gif_filename }}" alt="GIF">
        <span class="list-item-text">{{ fantasy.description }}</span>
      </a>
      {% endfor %}
    </div>
  {% else %}
    <div class="fant-card">
      <p class="fant-text" style="font-size: 18px; color: var(--text-muted);">
        Пока нет ни одного фанта.<br>Давай создадим первый!
      </p>
    </div>
  {% endif %}

  <footer class="actions">
    <a href="/create" class="btn btn-primary">Создать новый фант</a>
    <a href="/random" class="btn btn-secondary">Мне повезёт (Случайный)</a>
  </footer>
</main>

</body>
</html>
