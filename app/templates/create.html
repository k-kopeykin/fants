{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">Новый фант</div>
            <div class="card-body">
                <form action="/create" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="description" class="form-label">Задание</label>
                        <input type="text" class="form-control" id="description" name="description" placeholder="Например: Станцуй ламбаду" required>
                    </div>
                    <div class="mb-3">
                        <label for="gif" class="form-label">GIF-анимация</label>
                        <input type="file" class="form-control" id="gif" name="gif" accept="image/gif" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Создать</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
