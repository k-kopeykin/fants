{% extends "base.html" %}

{% block title %}Новый фант — Фанты{% endblock %}

{% block content %}

<section class="fant-card" style="display: block; padding: 28px 24px;">
  <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 24px; text-align: center; color: var(--text);">
    Новый фант
  </h2>

  <form action="/create" method="post" enctype="multipart/form-data">

    <div class="form-group">
      <label for="description" class="form-label">Задание</label>
      <input
        type="text"
        id="description"
        name="description"
        class="form-input"
        placeholder="Например: Станцуй ламбаду"
        required
        maxlength="200"
      >
    </div>

    <div class="form-group">
      <label for="gif" class="form-label">GIF-анимация</label>
      <input
        type="file"
        id="gif"
        name="gif"
        class="form-file"
        accept="image/gif"
        required
      >
    </div>

    <button type="submit" class="btn btn-primary" style="margin-top: 8px;">
      Создать фант
    </button>

  </form>
</section>

{% endblock %}
